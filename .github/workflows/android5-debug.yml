name: Android 5 debug build

# Manual build of a debug APK (signed with the default debug key, so no secrets are needed).
# Run it from: Actions > Android 5 debug build > Run workflow.
# The APKs appear at the bottom of the finished run, under "Artifacts".
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APKs
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Lint (reports API calls missing on old Android; never fails the run)
        continue-on-error: true
        run: ./gradlew :androidApp:lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: limusic-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: androidApp/build/reports/lint-results-debug.*
          if-no-files-found: ignore
